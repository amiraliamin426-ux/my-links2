<style>
  /* این ظرف فقط برای چیدن ۳ آیتم کنار هم است */
  .row-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* یعنی ۳ ستون برابر */
    gap: 20px; /* فاصله بین آیتم‌ها */
  }

  .item-card {
    border: 1px solid #ccc;
    padding: 10px;
    cursor: pointer;
    text-align: center;
  }
</style>

<script>
  function toggleDetails(element) {
    // پیدا کردن بخش جزئیات داخل همین کارتی که روی آن کلیک شده
    const details = element.querySelector('.details');
    // تغییر وضعیت نمایش
    details.style.display = (details.style.display === "block") ? "none" : "block";
  }
</script>
